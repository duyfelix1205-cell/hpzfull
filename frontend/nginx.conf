server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 'ok\n';
  }

  # Standalone Catalog admin is reachable over HTTPS and protected by backend password auth.
  # Trusted IAM headers still work for internal/platform callers.
  location ^~ /api/v1/admin/ {
    proxy_pass http://catalog-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 9m;
  }

  location /api/ {
    proxy_pass http://catalog-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 9m;
  }
  location /media/ {
    proxy_pass http://catalog-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }
  location /health/ { proxy_pass http://catalog-backend:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
