services:
  catalog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-catalog} -d ${POSTGRES_DB:-nexora_catalog}"]
      interval: 5s
      timeout: 3s
      retries: 20
  catalog-backend:
    build: ./backend
    environment:
      PORT: 8080
      CATALOG_DB_URL: postgres://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD:-catalog}@catalog-postgres:5432/${POSTGRES_DB:-nexora_catalog}
      ORDERS_ADAPTER: ${ORDERS_ADAPTER:-fixture}
      ORDERS_BASE_URL: ${ORDERS_BASE_URL:-https://crm.hungtp.click}
      ORDERS_INTERNAL_TOKEN: ${ORDERS_INTERNAL_TOKEN:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      MEDIA_ROOT: /app/uploads
      MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-8388608}
    volumes:
      - catalog_media:/app/uploads
    depends_on:
      catalog-postgres:
        condition: service_healthy
    command: ["sh","-c","node src/migrate.js && node src/server.js"]
    ports: ["8080:8080"]
  catalog-frontend:
    build: ./frontend
    depends_on: [catalog-backend]
    ports: ["8081:80"]
volumes:
  catalog_pgdata:
  catalog_media:
