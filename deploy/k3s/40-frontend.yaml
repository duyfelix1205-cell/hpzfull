apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-frontend, namespace: product-catalog }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog-frontend } }
  template:
    metadata: { labels: { app: catalog-frontend } }
    spec:
      containers:
        - name: frontend
          image: REPLACE_CATALOG_FRONTEND_IMAGE
          ports: [{ containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-frontend, namespace: product-catalog }
spec:
  selector: { app: catalog-frontend }
  ports: [{ port: 80, targetPort: 80 }]
