apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-postgres
  namespace: product-catalog
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-media
  namespace: product-catalog
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
