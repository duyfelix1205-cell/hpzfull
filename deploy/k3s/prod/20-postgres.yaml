apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-postgres
  namespace: product-catalog
  labels:
    app.kubernetes.io/name: catalog-postgres
    app.kubernetes.io/part-of: product-catalog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog-postgres
  template:
    metadata:
      labels:
        app: catalog-postgres
        app.kubernetes.io/name: catalog-postgres
        app.kubernetes.io/part-of: product-catalog
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: catalog-postgres-secret
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalog-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-postgres
  namespace: product-catalog
spec:
  selector:
    app: catalog-postgres
  ports:
    - port: 5432
      targetPort: 5432
