apiVersion: v1
kind: ConfigMap
metadata: { name: catalog-config, namespace: product-catalog }
data:
  PORT: "8080"
  ORDERS_ADAPTER: "fixture"
  ORDERS_BASE_URL: "https://crm.hungtp.click"
  SYNC_INTERVAL_SECONDS: "60"
  MEDIA_ROOT: "/app/uploads"
  MAX_MEDIA_BYTES: "8388608"
  STOCK_STALE_SECONDS: "300"
  ADMIN_AUTH_MODE: "trusted_headers"
  ADMIN_ALLOWED_ROLES: "catalog-admin,nexora-admin"
---
apiVersion: v1
kind: Secret
metadata: { name: catalog-postgres-secret, namespace: product-catalog }
type: Opaque
stringData:
  POSTGRES_DB: "nexora_catalog"
  POSTGRES_USER: "catalog"
  POSTGRES_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata: { name: catalog-backend-secret, namespace: product-catalog }
type: Opaque
stringData:
  CATALOG_DB_URL: "postgres://catalog:REPLACE_ME@catalog-postgres:5432/nexora_catalog"
  ORDERS_INTERNAL_TOKEN: ""
