name: Sync Orders Customer Integration Secret

on:
  workflow_run:
    workflows: ["Deploy Product Catalog Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-customer-integration-config
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, nexora-catalog]
    timeout-minutes: 10
    steps:
      - name: Sync CRM Orders integration credential into Catalog namespace
        shell: bash
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1 && kubectl get namespace default >/dev/null 2>&1; then KUBE='kubectl';
          elif command -v k3s >/dev/null 2>&1 && k3s kubectl get namespace default >/dev/null 2>&1; then KUBE='k3s kubectl';
          else KUBE='sudo -n k3s kubectl'; fi
          token="$($KUBE -n crm get secret crm-secrets -o jsonpath='{.data.CATALOG_CUSTOMER_SHARED_SECRET}' | base64 -d)"
          test -n "$token" || { echo '[ERROR] Orders CATALOG_CUSTOMER_SHARED_SECRET is empty'; exit 1; }
          echo "::add-mask::$token"
          $KUBE get namespace product-catalog >/dev/null
          $KUBE -n product-catalog create secret generic catalog-orders-customer-secret \
            --from-literal=CUSTOMER_ORDERS_INTERNAL_TOKEN="$token" \
            --dry-run=client -o yaml | $KUBE apply -f -

          if $KUBE -n product-catalog get deployment catalog-backend >/dev/null 2>&1; then
            $KUBE -n product-catalog rollout restart deployment/catalog-backend
            $KUBE -n product-catalog rollout status deployment/catalog-backend --timeout=180s
          fi
          echo '[OK] Catalog customer integration credential synchronized without exposing its value.'

      - name: Feature smoke — Catalog to Orders customer contract
        shell: bash
        run: |
          set -euo pipefail
          if command -v kubectl >/dev/null 2>&1 && kubectl get namespace default >/dev/null 2>&1; then KUBE='kubectl';
          elif command -v k3s >/dev/null 2>&1 && k3s kubectl get namespace default >/dev/null 2>&1; then KUBE='k3s kubectl';
          else KUBE='sudo -n k3s kubectl'; fi

          $KUBE -n product-catalog exec -i deployment/catalog-backend -- node - <<'NODE'
          const base=String(process.env.ORDERS_BASE_URL||'').replace(/\/$/,'');
          const token=process.env.CUSTOMER_ORDERS_INTERNAL_TOKEN||'';
          if(!base||!token) throw new Error('Catalog customer integration env is missing after rollout');
          const integration=await fetch(base+'/api/v1/integration/catalog/ping',{headers:{authorization:`Bearer ${token}`}});
          const body=await integration.json().catch(()=>null);
          console.log('orders-customer-contract',integration.status,JSON.stringify(body));
          if(!integration.ok||body?.ok!==true||body?.contract!=='INT-ORD-CAT-001')process.exit(1);
          const local=await fetch('http://127.0.0.1:8080/api/v1/customer-auth/config');
          const auth=await local.json().catch(()=>null);
          console.log('customer-auth-config',local.status,JSON.stringify({google_enabled:Boolean(auth?.google_enabled),email_delivery_enabled:Boolean(auth?.email_delivery_enabled)}));
          if(!local.ok)process.exit(1);
          NODE
          echo '[OK] Catalog → Orders customer contract smoke passed.'
